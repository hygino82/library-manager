<div class="container">
  <label for="name">Nome</label><br />
  <input type="text" id="name" [(ngModel)]="category.name" /><br />
  <label for="description">Descrição</label><br />
  <input type="text" id="description" [(ngModel)]="category.description" /><br />
  <label> <strong>Criado em: </strong> {{formatDate(category.createdAt)}}</label><br />
  <label> <strong>Atualizado em:</strong> {{formatDate(category.updatedAt)}}</label><br />
  <button type="submit" (click)="save()">Salvar</button>
</div>
