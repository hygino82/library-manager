<p-table
  [value]="bookLoans"
  [paginator]="true"
  [rows]="10"
  [responsiveLayout]="'stack'"
  styleClass="p-datatable-striped"
  [tableStyle]="{ 'min-width': '50rem' }">

  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="bookTitle">Título <p-sortIcon field="bookTitle"></p-sortIcon></th>
      <th pSortableColumn="userName">Usuário <p-sortIcon field="userName"></p-sortIcon></th>
      <th>Início</th>
      <th>Fim</th>
      <th>Status</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-loan>
    <tr>
      <td>{{ loan.bookTitle }}</td>
      <td>{{ loan.userName }}</td>
      <td>{{ loan.startDate | date: 'dd/MM/yyyy' }}</td>
      <td>{{ loan.endDate | date: 'dd/MM/yyyy' }}</td>
      <td>
        <p-tag
          [severity]="loan.hasActiveLoan ? 'success' : 'danger'"
          [value]="loan.hasActiveLoan ? 'Ativo' : 'Inativo'">
        </p-tag>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="5">Nenhum registro encontrado.</td>
    </tr>
  </ng-template>
</p-table>
