
<div class="container">
  <p-table
    [value]="categoryPage.content"
    [tableStyle]="{ 'min-width': '40rem' }"
    stripedRows
    showGridlines
    selectionMode="single"
    [(selection)]="selectedCategory"
    dataKey="id"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Nome</th>
        <th>Descrição</th>
        <th>Ações</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-category>
      <tr
        [pSelectableRow]="category"
        [ngClass]="{
          'selected-row': selectedCategory?.id === category.id
        }"
      >
        <td>{{ category.name }}</td>
        <td>{{ category.description }}</td>

        <td>
          <div class="actions">
            <p-button
              icon="pi pi-file-edit"
              severity="warn"
              [rounded]="true"
              pTooltip="Editar categoria"
              tooltipPosition="top"
              [routerLink]="['/categorias/form', category.id]"
            />

            <p-button
              icon="pi pi-trash"
              severity="danger"
              [rounded]="true"
              pTooltip="Remover"
              tooltipPosition="top"
              (onClick)="removeCategoryById(category.id)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3">
          Nenhuma categoria cadastrada.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
