<div>
  <label for="name">Nome</label><br>
  <input type="text" [(ngModel)]="name" name="name" id="name"><br>
  <button (click)="getUsersPage()">Buscar</button>
</div>

<p-table [value]="users" [paginator]="true" [rows]="10" [showCurrentPageReport]="true" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros">
  <ng-template pTemplate="header">
    <tr>
      <th>Nome</th>
      <th>Atributo</th>
      <th>Status</th>
      <th>Ações</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-user>
    <tr>
      <td>{{ user.name }}</td>
      <td>{{ user.schoolAttribute }}</td>
      <td>{{ user.hasLoan ? 'Sim' : 'Não' }}</td>
      <td>
        <div class="margem-botao">
          <p-button styleClass="p-button-primary p-button-icon-only"
                    pTooltip="Informação"
                    tooltipPosition="top"
                    (click)="getUserById(user.id)">
            <i class="pi pi-question-circle"></i>
          </p-button>

          <p-button
            [style]="{'background-color': 'orange', 'border': 'none', 'color': 'white'}"
            styleClass="p-button-icon-only"
            pTooltip="Editar usuário"
            tooltipPosition="top"
            [routerLink]="['/usuarios/form', user.id]">
            <i class="pi pi-file-edit"></i>
          </p-button>
          <p-button styleClass="p-button-danger p-button-icon-only"
                    pTooltip="Remover"
                    tooltipPosition="top"
                    (click)="removeUser(user.id)">
            <i class="pi pi-trash"></i>
          </p-button>

          @if (!user.hasLoan) {
            <p-button
              [style]="{'background-color': 'blue', 'border': 'none', 'color': 'white'}"
              styleClass="p-button-icon-only"
              pTooltip="Emprestar livro"
              tooltipPosition="top"
            (onClick)="borrowBook(user.id)"
            >
              <i class="pi pi-book"></i>
            </p-button>
          } @else {
            <p-button
              [style]="{'background-color': 'brown', 'border': 'none', 'color': 'white'}"
              styleClass="p-button-secondary p-button-icon-only"
              pTooltip="Indisponível"
              tooltipPosition="top"
              disabled="true">
              <i class="pi pi-lock"></i>
            </p-button>
          }
        </div>
    </tr>
  </ng-template>
</p-table>
