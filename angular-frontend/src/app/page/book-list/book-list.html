<p-table
  [value]="books"
  [tableStyle]="{ 'min-width': '50rem' }"
  stripedRows="true"
  selectionMode="single"
  [(selection)]="selectedBook"
>
  <!-- Cabeçalho -->
  <ng-template pTemplate="header">
    <tr>
      <th>#</th>
      <th>Título</th>
      <th>Autor</th>
      <th>Páginas</th>
      <th>Ações</th>
    </tr>
  </ng-template>

  <!-- Corpo -->
  <ng-template pTemplate="body" let-book>
    <tr [pSelectableRow]="book">
      <td>{{ book.id }}</td>
      <td>{{ book.title }}</td>
      <td>{{ book.author }}</td>
      <td>{{ book.totalPages }}</td>
      <td>
        <p-button styleClass="p-button-primary p-button-icon-only">
          <i class="pi pi-question-circle"></i>
        </p-button>
        <p-button styleClass="p-button-danger p-button-icon-only">
          <i class="pi pi-trash"></i>
        </p-button>
      </td>
    </tr>
  </ng-template>
</p-table>
