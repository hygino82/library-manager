<div class="menu-busca">
  <form>
    <label for="titulo">Título</label><br>
    <input type="text"
           id="titulo"
           [(ngModel)]="title"
           [name]="title"
           [ngModelOptions]="{ standalone: true }">
    <br>

    <label for="autor">Autor</label><br>
    <input type="text"
           id="autor"
           [(ngModel)]="author"
           [name]="author"
           [ngModelOptions]="{ standalone: true }">
    <br>

    <select
      class="form-select"
      [(ngModel)]="status"
      name="status"
    >
      <option value="">Todos</option>
      <option value="AVAILABLE">Disponíveis</option>
      <option value="IN_USE">Emprestados</option>
    </select>


    <p-button
      [style]="{ 'margin-top': '30px' }"
      label="Buscar"
      styleClass="p-button-primary"
      (click)="getBooks()">
    </p-button>
  </form>
</div>


<div class="listagem-livros">
  <p-table
    [value]="books"
    [tableStyle]="{ 'min-width': '50rem' }"
    stripedRows="true"
    selectionMode="single"
    [(selection)]="selectedBook"
  >
    <!-- Cabeçalho -->
    <ng-template pTemplate="header">
      <tr>
        <!--th>#</th-->
        <th>Título</th>
        <th>Autor</th>
        <th>Páginas</th>
        <th>Código</th>
        <th>Ações</th>
      </tr>
    </ng-template>

    <!-- Corpo -->
    <ng-template pTemplate="body" let-book>
      <tr [pSelectableRow]="book">
        <!--<td>{{ book.id }}</td-->
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.totalPages }}</td>
        <td>{{ book.personalCode }}</td>
        <td>
          <div class="margem-botao">
            <p-button styleClass="p-button-primary p-button-icon-only"
                      pTooltip="Informação"
                      tooltipPosition="top"
                      (click)="getBook(book.id)">
              <i class="pi pi-question-circle"></i>
            </p-button>

            <p-button
              [style]="{'background-color': 'orange', 'border': 'none', 'color': 'white'}"
              styleClass="p-button-icon-only"
              pTooltip="Editar livro"
              tooltipPosition="top"
              [routerLink]="['/livros/cadastro', book.id]">
              <i class="pi pi-file-edit"></i>
            </p-button>
            <p-button styleClass="p-button-danger p-button-icon-only"
                      pTooltip="Remover"
                      tooltipPosition="top"
                      (click)="removeBook(book.id)">
              <i class="pi pi-trash"></i>
            </p-button>

            @if (book.bookStatus === 'AVAILABLE') {
              <p-button
                [style]="{'background-color': 'blue', 'border': 'none', 'color': 'white'}"
                styleClass="p-button-icon-only"
                pTooltip="Emprestar livro"
                tooltipPosition="top"
                (click)="borrowBook(book.id)">
                <i class="pi pi-book"></i>
              </p-button>
            } @else {
              <p-button
                [style]="{'background-color': 'brown', 'border': 'none', 'color': 'white'}"
                styleClass="p-button-secondary p-button-icon-only"
                pTooltip="Indisponível"
                tooltipPosition="top"
                disabled="true">
                <i class="pi pi-lock"></i>
              </p-button>
            }

          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
